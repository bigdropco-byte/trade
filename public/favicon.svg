<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04120D"/>
      <stop offset="50%" stop-color="#082319"/>
      <stop offset="100%" stop-color="#0E3326"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Profit Trajectory Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>

    <!-- Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Standout SERP Contrast -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base with Rich Dark Emerald Core -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" stroke="url(#borderGrad)" stroke-width="16"/>

  <!-- Subtle Chart Baseline Grid -->
  <line x1="80" y1="410" x2="432" y2="410" stroke="#134E39" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 10"/>

  <!-- Scrapbook Performance Candlestick Volume Bars -->
  <rect x="96" y="340" width="36" height="70" rx="8" fill="url(#barGrad)"/>
  <rect x="176" y="270" width="36" height="140" rx="8" fill="url(#barGrad)"/>
  <rect x="256" y="310" width="36" height="100" rx="8" fill="url(#barGrad)"/>
  <rect x="336" y="200" width="36" height="210" rx="8" fill="url(#barGrad)"/>

  <!-- High-Growth Profit Trajectory Curve -->
  <path d="M96 350 L180 250 L260 290 L390 135" 
        stroke="url(#lineGrad)" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Bull Trend Arrow Target -->
  <path d="M305 135 H390 V220" 
        stroke="url(#lineGrad)" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Peak Profit Glow Core -->
  <circle cx="390" cy="135" r="24" fill="#6EE7B7"/>
  <circle cx="390" cy="135" r="12" fill="#FFFFFF"/>
</svg>
